<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tela — compartilhamento P2P</title>

  <!-- Grotesque condensada para os rótulos, igual à referência.
       Sempre com fallback de sistema: se o Google Fonts cair, a página
       continua legível em vez de virar Times New Roman. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Narrow:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Material Symbols: só os dois glifos que usamos (fullscreen e
       fullscreen_exit), pedidos num arquivo só. opsz/wght/FILL/GRAD são os
       eixos variáveis da fonte — o CSS em header.css escolhe os valores. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=fullscreen,fullscreen_exit">

  <!-- Tres arquivos em <link> paralelos, e nao @import: o navegador baixa
       os tres de uma vez, enquanto @import so descobre o segundo depois de
       baixar o primeiro. Ordem importa: base define as variaveis. -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/palco.css">
  <!-- So tem efeito dentro do app Electron: todas as regras estao
       atras da classe .no-desktop, que so o app poe no <html>. -->
  <link rel="stylesheet" href="css/desktop.css">
</head>
<body>

  <!-- ===================================================================
       HEADER — recolhe e reabre por CLIQUE, nunca por hover.
       A seta de recolher (#btn-header) fica pendurada na borda inferior
       da barra e desliza junto com ela.
       =================================================================== -->
  <div id="barra">
    <header id="painel">

    <div class="controles">

      <!-- etiqueta de modo + status, na MESMA linha -->
      <span id="modo" class="etiqueta">…</span>
      <span id="status">Iniciando</span>
      <span id="contador" class="badge" hidden>0 assistindo</span>

      <label id="qualidade" class="pilula" hidden>
        <span class="rotulo">Qualidade</span>
        <select id="sel-qualidade">
          <option value="3840">4K</option>
          <option value="2560">2K</option>
          <option value="1920">1080p</option>
          <option value="1280" selected>720p</option>
        </select>
      </label>

      <button id="btn-principal" class="acao" disabled>
        <span>…</span>
      </button>

      <button id="btn-parar" class="pilula" hidden>Parar</button>

      <button id="btn-fullscreen" class="pilula icone" title="Tela cheia (F)"
              aria-label="Tela cheia">
        <span id="txt-fullscreen" class="material-symbols-outlined"
              aria-hidden="true">fullscreen</span>
      </button>
    </div>

    <!-- link da sala: aparece só depois que o host conecta ao broker -->
    <div id="area-link" class="pilula link" hidden>
      <span class="rotulo">Link</span>
      <input id="link" type="text" readonly aria-label="Link da sala">
      <button id="btn-copiar">Copiar</button>
    </div>

      <div id="aviso" hidden></div>
    </header>

    <!-- Seta pendurada na borda inferior do header. Fica dentro de #barra
         (e nao de #painel) para nao herdar o visibility:hidden do painel
         recolhido — mas desliza junto com ele, porque quem se move e a
         #barra inteira. A seta gira 180 graus conforme o estado. -->
    <button id="btn-header" class="seta-header" title="Recolher barra (H)"
            aria-label="Recolher barra" aria-expanded="true"
            aria-controls="painel">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path d="M6 15l6-6 6 6" fill="none" stroke="currentColor"
              stroke-width="2.2" stroke-linecap="round"
              stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <!-- ===================================================================
       PALCO — o vídeo. A coisa mais clara da página, sobre preto puro.
       autoplay    : começa sozinho
       playsinline : ESSENCIAL no iOS. Sem isso o iPhone joga em fullscreen
                     nativo sozinho e perde o controle da página.
       muted       : aplicado só na PRÉVIA DO HOST, via app.js — senão o
                     áudio capturado volta pela caixa de som e dá microfonia.
       =================================================================== -->
  <main id="palco">
    <video id="video" autoplay playsinline hidden></video>

    <!-- O estado vazio do palco: serve para "nada sendo exibido", para
         "sala nao encontrada" (o nosso 404) e para as esperas. Quem troca
         o texto e o data-estado e a funcao palcoVazio(), em js/ui.js —
         nunca textContent direto, senao o mascote some junto. -->
    <div id="vazio" data-estado="espera">
      <img id="vazio-img" src="img/techy.jpg" alt="" width="160" height="160"
           draggable="false">
      <p id="vazio-texto">Nada sendo exibido ainda.</p>
    </div>
  </main>

  <!-- PeerJS via CDN, script classico: define o global Peer.
       Tem que vir ANTES dos modulos, que o usam. -->
  <script src="https://unpkg.com/peerjs@1.5/dist/peerjs.min.js"></script>

  <!-- Ponto de entrada. type="module" carrega os outros js/ via import.
       Modulos sao defer por padrao, entao rodam depois do HTML pronto —
       por isso o app.js pode buscar elementos sem esperar DOMContentLoaded. -->
  <script type="module" src="js/app.js"></script>

</body>
</html>
